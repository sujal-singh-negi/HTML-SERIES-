<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelStud.com - Book your tickets for Bali </title>
    <style>
        
/* General Styling */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #e0e7ff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Form Styling */
form {
    background-color: white;
    width: 100%;
    max-width: 450px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

/* Input Containers */
form div {
    margin-bottom: 20px;
}

/* Labels */
label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #1e293b;
    text-transform: capitalize;
}

/* Input Fields */
input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
    background-color: #f8fafc;
}

input:focus,
textarea:focus {
    border-color: #2563eb;
    background-color: white;
    box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
}

/* Address Textarea */
textarea {
    height: 100px;
    resize: vertical;
}

/* Submit Button */
button {
    width: 100%;
    padding: 13px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #1d4ed8;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

/* Mobile Responsive */
@media (max-width: 480px) {
    form {
        padding: 25px 20px;
    }
}

    </style>
</head>

<body>
    <form action="">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter Your Name">
        </div>
        <div>
            <label for="age">age</label>
            <input id="age" type="number" placeholder="Enter Your Age">
        </div>
        <div>
            <label for="phone">Phone</label>
            <input id="phone" type="tel" placeholder="Enter Your Phone Number">
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter Your emailId">
        </div>
        <div>
            <label for="Address">Address</label>
            <textarea name="address" id="add"></textarea>
        </div>
        <div><button type="submit">Submit</button></div>
    </form>
</body>

</html>
